# Build the base image (Dockerfile.base) natively for linux/amd64 and linux/arm64,
# and publish it as one multi-arch tag on ghcr.io.
#
# The tag is the date and short hash of the last commit that changed the base image
# (YYYYMMDD-abcdef1), unique per change, so the main Dockerfile can pin it. Pull requests only build; pushes to master publish a tag
# that does not exist yet.

name: Base image

on:
  push:
    branches: [ master ]
    paths:
      - Dockerfile.base
      - docker/files/**
      - .github/workflows/docker-base.yml
  pull_request:
    branches: [ master, 'maint/*' ]
    paths:
      - Dockerfile.base
      - docker/files/**
      - .github/workflows/docker-base.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/nipreps/mriqc-base

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      date: ${{ steps.tag.outputs.date }}
      build: ${{ steps.tag.outputs.build }}
      push: ${{ steps.tag.outputs.push }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Tag from the last change to the base image
      id: tag
      run: |
        TAG=$( git log -1 --format=%cd-%h --abbrev=7 --date=format:%Y%m%d -- Dockerfile.base docker/files )
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "date=$( date -u +%Y-%m-%dT%H:%M:%SZ )" >> $GITHUB_OUTPUT
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          echo "Pull request: build ${IMAGE}:${TAG} without pushing"
          echo "build=true" >> $GITHUB_OUTPUT
          echo "push=false" >> $GITHUB_OUTPUT
        elif docker manifest inspect "${IMAGE}:${TAG}" > /dev/null 2>&1; then
          echo "${IMAGE}:${TAG} exists already"
          echo "build=false" >> $GITHUB_OUTPUT
          echo "push=false" >> $GITHUB_OUTPUT
        else
          echo "build=true" >> $GITHUB_OUTPUT
          echo "push=true" >> $GITHUB_OUTPUT
        fi

  build:
    needs: tag
    if: needs.tag.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - name: Log into ghcr.io
      if: needs.tag.outputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build ${{ matrix.platform }}
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile.base
        platforms: ${{ matrix.platform }}
        build-args: |
          BUILD_DATE=${{ needs.tag.outputs.date }}
          VCS_REF=${{ github.sha }}
        cache-from: type=gha,scope=base-${{ matrix.runner }}
        cache-to: type=gha,scope=base-${{ matrix.runner }},mode=max
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ needs.tag.outputs.push }}
    - name: Export digest
      if: needs.tag.outputs.push == 'true'
      run: |
        mkdir -p ${{ runner.temp }}/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "${{ runner.temp }}/digests/${digest#sha256:}"
    - name: Upload digest
      if: needs.tag.outputs.push == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ matrix.runner }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: [ tag, build ]
    if: needs.tag.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-*
        merge-multiple: true
    - uses: docker/setup-buildx-action@v4
    - name: Log into ghcr.io
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Join both platforms under one tag
      working-directory: ${{ runner.temp }}/digests
      run: |
        docker buildx imagetools create \
          -t "${IMAGE}:${{ needs.tag.outputs.tag }}" -t "${IMAGE}:latest" \
          $( printf "${IMAGE}@sha256:%s " * )
        docker buildx imagetools inspect "${IMAGE}:${{ needs.tag.outputs.tag }}"
