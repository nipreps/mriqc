# Build the MRIQC image and run it end to end on small DWI and FLAIR datasets,
# natively on linux/amd64 and linux/arm64.
#
# The test data come from public S3 buckets, pinned by object version and MD5
# (.github/testdata/*.json), and are kept in the Actions cache; when the cache is
# evicted, the next run fetches them again.

name: Integration

on:
  push:
    branches: [ master, 'maint/*' ]
    tags: [ '*' ]
    paths-ignore: [ 'docs/**', '**.md', '**.rst' ]
  pull_request:
    branches: [ master, 'maint/*' ]
    paths-ignore: [ 'docs/**', '**.md', '**.rst' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Get the version
      id: version
      run: |
        echo "version=$( uvx hatch version | tail -n1 | xargs )" >> "$GITHUB_OUTPUT"
        echo "date=$( date -u +%Y-%m-%dT%H:%M:%SZ )" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/${{ matrix.arch }}
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD_DATE=${{ steps.version.outputs.date }}
          VCS_REF=${{ github.sha }}
        cache-from: type=gha,scope=mriqc-${{ matrix.arch }}
        cache-to: type=gha,scope=mriqc-${{ matrix.arch }},mode=max
        tags: nipreps/mriqc:ci
        load: true
    - name: Check the version
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        expected="MRIQC v${VERSION}"
        found="$( docker run --rm nipreps/mriqc:ci --version )"
        echo "Expected: ${expected}, found: ${found}"
        test "${expected%+*}" == "${found%+*}"
    - name: Save the image
      run: docker save nipreps/mriqc:ci | zstd -T0 -3 -o ${{ runner.temp }}/mriqc.tar.zst
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: image-${{ matrix.arch }}
        path: ${{ runner.temp }}/mriqc.tar.zst
        compression-level: 0
        retention-days: 1

  test:
    name: ${{ matrix.modality }} (${{ matrix.arch }})
    needs: image
    strategy:
      fail-fast: false
      matrix:
        dataset: [ dwi, flair ]
        arch: [ amd64, arm64 ]
        include:
          - dataset: dwi
            modality: dwi
          - dataset: flair
            modality: FLAIR
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Outside the checkout, without '..': upload-artifact rejects relative segments
    - name: Set the paths
      run: |
        echo "DATA=${RUNNER_TEMP}/testdata/${{ matrix.dataset }}" >> "$GITHUB_ENV"
        echo "OUT=${RUNNER_TEMP}/out" >> "$GITHUB_ENV"
        echo "WORK=${RUNNER_TEMP}/work" >> "$GITHUB_ENV"

    - name: Restore the test data
      id: data
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.DATA }}
        key: testdata-${{ matrix.dataset }}-${{ hashFiles(format('.github/testdata/{0}.json', matrix.dataset), '.github/testdata/fetch.py') }}
    - name: Set up uv
      if: steps.data.outputs.cache-hit != 'true'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Fetch the test data
      if: steps.data.outputs.cache-hit != 'true'
      run: |
        uv run --no-project --with nibabel --with numpy \
          python .github/testdata/fetch.py .github/testdata/${{ matrix.dataset }}.json "$DATA"
    - name: Save the test data
      if: steps.data.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.DATA }}
        key: ${{ steps.data.outputs.cache-primary-key }}

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: image-${{ matrix.arch }}
        path: ${{ runner.temp }}
    - name: Load the image
      run: |
        zstd -dc ${{ runner.temp }}/mriqc.tar.zst | docker load
        rm ${{ runner.temp }}/mriqc.tar.zst

    - name: Run participant level
      run: |
        mkdir -p "$OUT" "$WORK"
        docker run --rm -u "$( id -u ):$( id -g )" -e MRIQC_DEV=1 \
          -v "$DATA:/data:ro" -v "$OUT:/out" -v "$WORK:/work" \
          nipreps/mriqc:ci /data /out participant -m ${{ matrix.modality }} \
          --no-sub --random-seed 42 --nprocs 4 --omp-nthreads 2 --ants-nthreads 1 \
          --verbose-reports -vv -w /work
    # The work directory starts empty, so every node's time is from this run
    - name: Summarize the node times
      continue-on-error: true
      run: python3 .maint/profile_nodes.py "$WORK" --top 15 --markdown >> "$GITHUB_STEP_SUMMARY"
    - name: Run group level
      run: |
        docker run --rm -u "$( id -u ):$( id -g )" -e MRIQC_DEV=1 \
          -v "$DATA:/data:ro" -v "$OUT:/out" -v "$WORK:/work" \
          nipreps/mriqc:ci /data /out group -m ${{ matrix.modality }} --no-sub -vv -w /work

    - name: Check the outputs
      run: |
        find "$OUT" -mindepth 1 | sed "s+^$OUT/++" | LC_ALL=C sort > outputs.txt
        diff .github/integration/outputs-${{ matrix.modality }}.txt outputs.txt
    # amd64 runs reproduce the reference exactly (--random-seed, single-threaded ANTs), so any
    # change fails (--strict); arm64 IQMs differ, so they are not compared
    - name: Compare the IQMs with the reference
      if: matrix.arch == 'amd64'
      run: |
        reference=mriqc/data/testdata/group_${{ matrix.modality }}.tsv
        if [[ ! -f "$reference" ]]; then
          echo "::notice::No reference IQMs yet in ${reference}"
          exit 0
        fi
        {
          echo "### IQMs against \`${reference}\`"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        docker run --rm -v "$OUT:/out:ro" -v "$PWD:/src:ro" --entrypoint dfcheck \
          nipreps/mriqc:ci -i /out/group_${{ matrix.modality }}.tsv -r /src/${reference} --strict \
          2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
        status=${PIPESTATUS[0]}
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

    - name: Upload the reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: reports-${{ matrix.dataset }}-${{ matrix.arch }}
        path: ${{ env.OUT }}
        if-no-files-found: ignore
        retention-days: 14
    - name: Keep the reports and command lines of the work directory
      if: failure()
      run: find "$WORK" -type f -not -name report.rst -not -name command.txt -delete || true
    - name: Upload the work directory
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: work-${{ matrix.dataset }}-${{ matrix.arch }}
        path: ${{ env.WORK }}
        if-no-files-found: ignore
        retention-days: 7
