[build-system]
requires = ["hatchling>=1.27", "hatch-vcs", "nipreps-versions"]
build-backend = "hatchling.build"

[project]
authors = [{name = "The NiPreps Developers", email = "nipreps@gmail.com"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "acres",
  "dipy >= 1.10.0",
  "matplotlib >= 3.10",
  "migas >= 0.4.0",
  "mriqc-learn",
  "nibabel >= 3.0.1",
  "nilearn >= 0.5.1",
  "nipype >= 1.12",
  "nireports >= 26.0",
  "nitime",
  "nitransforms >= 25.1",
  "niworkflows >= 1.15",
  "numpy >= 2.2",
  "orjson",
  "pandas >= 2.3",
  "psutil",
  "pyarrow",
  "pybids >= 0.15.6",
  "PyYAML",
  "scikit-learn >= 1.6",
  "scipy >= 1.15",
  "statsmodels",
  "templateflow",
  "toml",
  "torch >= 2.5",
]
description = "Automated Quality Control and visual reports for Quality Assessment of structural (T1w, T2w) and functional MRI of the brain."
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "mriqc"
readme = "README.rst"
requires-python = ">=3.13"

[project.urls]
"Docker Images" = "https://hub.docker.com/r/nipreps/mriqc/tags/"
Documentation = "https://mriqc.readthedocs.io/"
Homepage = "https://github.com/nipreps/mriqc"
Manuscript = "https://doi.org/10.1371/journal.pone.0184661"
NiPreps = "https://www.nipreps.org/"
"Sci Dat Paper" = "https://doi.org/10.1038/s41597-019-0035-4"
"Web API" = "https://mriqc.nimh.nih.gov/"

[project.optional-dependencies]
doc = [
  "nipype",
  "packaging",
  "pydot>=1.2.3",
  "pydotplus",
  "sphinx-argparse",
  "sphinx_rtd_theme",
  "sphinx >= 8",
]

container = [
  # templateflow extras
  "datalad",
  "datalad-osf",
]

rodents = [
  "nirodents >= 0.2.8",
]

notebook = [
  "ipython",
  "jupyter",
  "nipy",
]

dev = [
    "ruff == 0.17.3",
]

test = [
  "coverage",
  "mock",
  "pytest",
  "pytest-cov",
  "pytest-env",
  "pytest-xdist",
]

other = [
  "nitime",
  "scikit-image",
  "seaborn",
  "xvfbwrapper",
]

# Aliases
all = ["mriqc[doc,container,test,notebook,other,rodents]"]
docs = ["mriqc[doc]"]
others = ["mriqc[other]"]
tests = ["mriqc[test]"]

[project.scripts]
abide2bids = "mriqc.bin.abide2bids:main"
dfcheck = "mriqc.bin.dfcheck:main"
fs2gif = "mriqc.bin.fs2gif:main"
mriqc = "mriqc.cli.run:main"
mriqc_labeler = "mriqc.bin.labeler:main"
mriqcwebapi_test = "mriqc.bin.mriqcwebapi_test:main"
nib-hash = "mriqc.bin.nib_hash:main"
participants = "mriqc.bin.subject_wrangler:main"
synthstrip = "mriqc.synthstrip.cli:main"

#
# Hatch configurations
#

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
exclude = [".git_archival.txt"] # No longer needed in sdist

[tool.hatch.build.targets.wheel]
packages = ["mriqc"]
# exclude = [
#     "mriqc/tests/data",  # Large test data directory
# ]

##  The following two sections configure setuptools_scm in the hatch way

[tool.hatch.version]
raw-options = {version_scheme = "nipreps-calver"}
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "mriqc/_version.py"

#
# Pixi: the environment shipped in the Docker image (see pixi.lock). AFNI, ANTs and
# svht_denoise come from the base image (Dockerfile.base), not from here.
#

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

# The image runs Ubuntu 22.04 (glibc 2.35); git-annex's wheels need glibc 2.34
[tool.pixi.system-requirements]
libc = "2.35"

[tool.pixi.environments]
default = { features = ["editable"], solve-group = "default" }
test = { features = ["editable", "test"], solve-group = "default" }
# The Docker image ships this environment; it includes the tests CircleCI runs in the image
mriqc = { features = ["production", "container", "rodents", "test"], solve-group = "production" }

[tool.pixi.feature.editable.pypi-dependencies]
mriqc = { path = ".", editable = true }

[tool.pixi.feature.production.pypi-dependencies]
mriqc = { path = ".", editable = false }

[tool.pixi.dependencies]
python = "3.13.*"
graphviz = "14.*"
h5py = "3.16.*"
matplotlib = "3.11.*"
numpy = "2.5.*"
pandas = "3.1.*"
pytorch-cpu = "2.14.*"
scikit-image = "0.26.*"
scikit-learn = "1.9.*"
scipy = "1.18.*"

[tool.pixi.feature.container.dependencies]
git = "*"

# conda-forge has no linux-aarch64 git-annex; its PyPI wheels cover both
[tool.pixi.feature.container.pypi-dependencies]
git-annex = ">=10.20260717"

#
# Developer tool configurations
#

[tool.pytest.ini_options]
addopts = [
  "-svx", "--doctest-modules", "-ra", "--strict-config", "--strict-markers",
  # datalad's plugin (installed with the container extra) collects every file with
  # doctests, overriding --ignore
  "-p", "no:datalad",
]
doctest_optionflags = "ALLOW_UNICODE NORMALIZE_WHITESPACE ELLIPSIS"
env = "PYTHONHASHSEED=0"
filterwarnings = ["ignore::DeprecationWarning"]
junit_family = "xunit2"
log_level = "INFO"
minversion = "7"
norecursedirs = [".git"]
xfail_strict = true

[tool.coverage.run]
branch = true
omit = [
  '*/tests/*',
  '*/__init__.py',
  '*/conftest.py',
  'mriqc/_version.py',
]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
  'raise NotImplementedError',
  'warnings\.warn',
]

[tool.codespell]
# nd - import scipy.ndimage as nd
# mapp, reson -- Mapp. and Reson. abbreviations in citation
ignore-words-list = 'nd,mapp,reson'
skip = """
./.git,*.pdf,*.svg,*.min.js,*.ipynb,ORIGINAL_LICENSE,\
./docs/source/_static/example_anatreport.html"""

[tool.ruff]
exclude = [".maint/update_authors.py"]
line-length = 99

[tool.ruff.lint]
# Select rules explicitly (ruff's defaults plus our families), so that
# changes to ruff's default rule set do not enable new rules here.
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "W",
  "I",
  "UP",
  "YTT",
  "S",
  "BLE",
  "B",
  "A",
  "C4",
  "DTZ",
  "T10",
  "EXE",
  "FA",
  "ISC",
  "ICN",
  "PT",
  "Q",
]
ignore = [
  # zip() without strict= (flagged since the Python 3.10 floor). Choosing
  # strict=True changes runtime behaviour: audit with the SPEC 0 update.
  "B905",
  "F841",
  "S310",
  "S311", # We are not using random for cryptographic purposes
  "S603",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.extend-per-file-ignores]
"*/test_*.py" = ["S101"]
"docs/notebooks/*.ipynb" = ["B018", "A001", "A002", "F401", "F821"]
"docs/source/conf.py" = ["A001"]
"mriqc/bin/nib_hash.py" = ["S324"]
"mriqc/config.py" = ["S105"]
"mriqc/conftest.py" = ["PT004"]
"mriqc/engine/plugin.py" = ["BLE001"]
"mriqc/utils/debug.py" = ["A002", "T100"]

[tool.ruff.format]
quote-style = "single"
